<title id="title">Parallel lines and transversals</title><desc id="desc">Four parallel horizontal lines AB, CD, EF and GH. QR crosses them at Q, X, Y and R. SU crosses EF at T and meets GH at U. UD connects U to D. Measurements SU 9 cm and UD 8 cm; a 5 cm label appears above EF to the right of T. Schematic, not to scale.</desc>
