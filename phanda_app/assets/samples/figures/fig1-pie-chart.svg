<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 440 220" role="img" aria-labelledby="title desc">
<title id="title">Tea, coffee and tobacco pie chart</title>
<desc id="desc">Clean reconstruction of the supplied chart. Tea 107 degrees; Tobacco 208 degrees; Coffee inferred as 45 degrees. Elliptical perspective with depth.</desc>
<defs><pattern id="stipple" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="white"/><circle cx="1.3" cy="1.3" r="0.42" fill="#666"/><circle cx="3.8" cy="3.5" r="0.32" fill="#888"/></pattern></defs>
<g stroke="#171717" stroke-width="1.2" stroke-linejoin="round">
<path d="M 425.000,100.000 A 205,82 0 0,1 416.042,123.974 L 416.042,153.974 A 205,82 0 0,0 425.000,130.000 Z" fill="#111"/>
<path d="M 416.042,123.974 A 205,82 0 0,1 316.242,172.402 L 316.242,202.402 A 205,82 0 0,0 416.042,153.974 Z" fill="#eee"/>
<path d="M 316.242,172.402 A 205,82 0 0,1 15.000,100.000 L 15.000,130.000 A 205,82 0 0,0 316.242,202.402 Z" fill="url(#stipple)"/>
<path id="slice-tea" d="M 220,100 L 220.000,18.000 A 205,82 0 0,1 416.042,123.974 Z" fill="#111111"/>
<path id="slice-coffee" d="M 220,100 L 416.042,123.974 A 205,82 0 0,1 316.242,172.402 Z" fill="#ffffff"/>
<path id="slice-tobacco" d="M 220,100 L 316.242,172.402 A 205,82 0 1,1 220.000,18.000 Z" fill="url(#stipple)"/>
</g>
<g font-family="Georgia, Times New Roman, serif" font-weight="bold" text-anchor="middle">
<g fill="white" font-size="23"><text x="338" y="80">Tea</text><text x="278" y="64">107°</text></g>
<g fill="#111" font-size="23"><text x="322" y="143">Coffee</text><text x="115" y="82">Tobacco</text><text x="158" y="120">208°</text></g>
</g></svg>